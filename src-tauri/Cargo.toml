[package]
name = "notesapp"
version = "0.1.0"
description = "NotesApp — AI-assisted markdown note-taking desktop app"
authors = ["NotesApp Contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "notesapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = ["test"] }
tauri-plugin-log    = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
thiserror        = "1"
log              = "0.4"
tokio            = { version = "1", features = ["full"] }
toml             = "0.8"
notify           = "7"
notify-debouncer-mini = "0.5"
tantivy          = "0.22"
pdf-extract      = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
spellbook = "0.4"

[dev-dependencies]
tempfile = "3"
